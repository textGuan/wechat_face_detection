<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotlight Search Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 100px;
    }

    .hint {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      backdrop-filter: blur(10px);
    }

    .spotlight-container {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 12px;
      box-shadow: 0 22px 70px 4px rgba(0, 0, 0, 0.28), 0 0 0 0.5px rgba(0, 0, 0, 0.08);
      padding: 12px;
      width: 700px;
    }

    .search-box {
      display: flex;
      align-items: center;
      height: 36px;
      padding: 0 12px;
    }

    .search-icon {
      width: 20px;
      height: 20px;
      color: #888;
      margin-right: 10px;
      flex-shrink: 0;
    }

    #searchInput {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 18px;
      outline: none;
      color: #333;
    }

    #searchInput::placeholder {
      color: #888;
    }

    .results-container {
      margin-top: 12px;
      max-height: 400px;
      overflow-y: auto;
      display: none;
    }

    .results-container.visible {
      display: block;
    }

    .result-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .result-item:hover,
    .result-item.selected {
      background: rgba(0, 122, 255, 0.1);
    }

    .result-icon {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background: linear-gradient(135deg, #007aff, #5856d6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .result-info {
      flex: 1;
      min-width: 0;
    }

    .result-title {
      font-size: 14px;
      color: #333;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-subtitle {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .results-container::-webkit-scrollbar {
      width: 8px;
    }

    .results-container::-webkit-scrollbar-track {
      background: transparent;
    }

    .results-container::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="hint">💡 试试在搜索框输入关键词，如 "计"、"G"、"文"</div>

  <div class="spotlight-container">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="搜索..." autocomplete="off">
    </div>
    <div class="results-container" id="resultsContainer">
    </div>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput')
    const resultsContainer = document.getElementById('resultsContainer')

    let allItems = [
      { title: '计算器', subtitle: '应用程序', icon: '🧮', type: 'app' },
      { title: '记事本', subtitle: '应用程序', icon: '📝', type: 'app' },
      { title: 'Safari 浏览器', subtitle: '应用程序', icon: '🌐', type: 'app' },
      { title: '邮件', subtitle: '应用程序', icon: '📧', type: 'app' },
      { title: '音乐', subtitle: '应用程序', icon: '🎵', type: 'app' },
      { title: '照片', subtitle: '应用程序', icon: '📸', type: 'app' },
      { title: '设置', subtitle: '系统偏好设置', icon: '⚙️', type: 'app' },
      { title: '终端', subtitle: '应用程序', icon: '💻', type: 'app' },
      { title: 'GitHub', subtitle: 'https://github.com', icon: '🔗', type: 'website' },
      { title: 'Google', subtitle: 'https://google.com', icon: '🔍', type: 'website' },
      { title: 'Stack Overflow', subtitle: 'https://stackoverflow.com', icon: '💡', type: 'website' },
      { title: '文档', subtitle: '我的文档', icon: '📄', type: 'file' },
      { title: '下载', subtitle: '下载文件夹', icon: '📥', type: 'file' },
      { title: '桌面', subtitle: '桌面文件夹', icon: '🖥️', type: 'file' },
      { title: '项目文件夹', subtitle: '工作空间', icon: '📁', type: 'file' }
    ]

    let currentResults = []
    let selectedIndex = 0

    function search(query) {
      if (!query.trim()) {
        currentResults = []
        renderResults()
        return
      }

      const lowerQuery = query.toLowerCase()
      currentResults = allItems.filter(item => 
        item.title.toLowerCase().includes(lowerQuery) ||
        item.subtitle.toLowerCase().includes(lowerQuery)
      )
      selectedIndex = 0
      renderResults()
    }

    function renderResults() {
      if (currentResults.length === 0) {
        resultsContainer.classList.remove('visible')
        return
      }

      resultsContainer.classList.add('visible')

      resultsContainer.innerHTML = currentResults.slice(0, 8).map((item, index) => `
        <div class="result-item ${index === selectedIndex ? 'selected' : ''}" data-index="${index}">
          <div class="result-icon">${item.icon}</div>
          <div class="result-info">
            <div class="result-title">${item.title}</div>
            <div class="result-subtitle">${item.subtitle}</div>
          </div>
        </div>
      `).join('')

      document.querySelectorAll('.result-item').forEach(el => {
        el.addEventListener('click', () => {
          const index = parseInt(el.dataset.index)
          selectItem(currentResults[index])
        })
      })
    }

    function selectItem(item) {
      alert('你选择了: ' + item.title)
      searchInput.value = ''
      search('')
      searchInput.focus()
    }

    searchInput.addEventListener('input', (e) => {
      search(e.target.value)
    })

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        searchInput.value = ''
        search('')
      } else if (e.key === 'ArrowDown') {
        e.preventDefault()
        if (currentResults.length > 0) {
          selectedIndex = Math.min(selectedIndex + 1, currentResults.length - 1)
          renderResults()
        }
      } else if (e.key === 'ArrowUp') {
        e.preventDefault()
        if (currentResults.length > 0) {
          selectedIndex = Math.max(selectedIndex - 1, 0)
          renderResults()
        }
      } else if (e.key === 'Enter') {
        if (currentResults.length > 0) {
          selectItem(currentResults[selectedIndex])
        }
      }
    })

    searchInput.focus()
  </script>
</body>
</html>
