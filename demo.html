<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotlight Search - 快捷键自定义演示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 60px;
      flex-direction: column;
      gap: 30px;
    }

    .hint {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      backdrop-filter: blur(10px);
      max-width: 600px;
      text-align: center;
      z-index: 2000;
    }

    .hint kbd {
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 6px;
      border-radius: 3px;
      margin: 0 2px;
    }

    .demo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      width: 100%;
      max-width: 800px;
    }

    .demo-title {
      color: white;
      font-size: 24px;
      font-weight: 600;
      text-align: center;
    }

    .demo-wrapper {
      display: flex;
      gap: 40px;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
    }

    .demo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .demo-section-title {
      color: rgba(255, 255, 255, 0.9);
      font-size: 16px;
      font-weight: 500;
    }

    .spotlight-container {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 12px;
      box-shadow: 0 22px 70px 4px rgba(0, 0, 0, 0.28), 0 0 0 0.5px rgba(0, 0, 0, 0.08);
      padding: 12px;
      width: 700px;
    }

    .search-box {
      display: flex;
      align-items: center;
      height: 36px;
      padding: 0 12px;
    }

    .search-icon {
      width: 20px;
      height: 20px;
      color: #888;
      margin-right: 10px;
      flex-shrink: 0;
    }

    #searchInput {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 18px;
      outline: none;
      color: #333;
    }

    #searchInput::placeholder {
      color: #888;
    }

    .settings-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: #888;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: all 0.15s;
    }

    .settings-btn:hover {
      background: rgba(0, 0, 0, 0.08);
      color: #333;
    }

    .settings-btn svg {
      width: 18px;
      height: 18px;
    }

    .results-container {
      margin-top: 12px;
      max-height: 400px;
      overflow-y: auto;
      display: none;
    }

    .results-container.visible {
      display: block;
    }

    .result-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .result-item:hover,
    .result-item.selected {
      background: rgba(0, 122, 255, 0.1);
    }

    .result-icon {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background: linear-gradient(135deg, #007aff, #5856d6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: 600;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .result-icon.clipboard-icon {
      background: linear-gradient(135deg, #34c759, #30d158);
    }

    .result-icon.snippet-icon {
      background: linear-gradient(135deg, #ff9500, #ff9f0a);
    }

    .result-info {
      flex: 1;
      min-width: 0;
    }

    .result-title {
      font-size: 14px;
      color: #333;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-subtitle {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 设置面板样式 */
    .settings-panel {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 16px;
      box-shadow: 0 22px 70px 4px rgba(0, 0, 0, 0.28);
      width: 450px;
      padding: 20px;
    }

    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    }

    .settings-header h3 {
      font-size: 18px;
      font-weight: 600;
      color: #333;
    }

    .close-settings {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: #888;
      font-size: 24px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-settings:hover {
      background: rgba(0, 0, 0, 0.08);
      color: #333;
    }

    .settings-content {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .setting-item label {
      font-size: 14px;
      font-weight: 500;
      color: #333;
    }

    .shortcut-input-wrapper {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #shortcutInput {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      font-size: 15px;
      background: white;
      color: #333;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    #shortcutInput:focus,
    #shortcutInput.recording {
      border-color: #007aff;
      outline: none;
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
    }

    #shortcutInput::placeholder {
      color: #999;
    }

    .clear-shortcut {
      padding: 10px 16px;
      border: none;
      background: rgba(0, 0, 0, 0.08);
      color: #333;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .clear-shortcut:hover {
      background: rgba(0, 0, 0, 0.12);
    }

    .features-list {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 700px;
    }

    .features-list h4 {
      color: white;
      margin-bottom: 15px;
      font-size: 18px;
    }

    .features-list ul {
      list-style: none;
      color: rgba(255, 255, 255, 0.9);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .features-list li {
      font-size: 14px;
      line-height: 1.6;
    }

    .features-list strong {
      color: white;
    }
  </style>
</head>
<body>
  <div class="hint">
    🔍 Spotlight 搜索演示 - 包含快捷键自定义功能
  </div>

  <div class="demo-container">
    <h1 class="demo-title">Spotlight Search</h1>
    
    <div class="demo-wrapper">
      <div class="demo-section">
        <h3 class="demo-section-title">搜索框界面</h3>
        <div class="spotlight-container">
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" placeholder="搜索..." autocomplete="off">
            <button class="settings-btn" id="settingsBtn" title="设置">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .45-2.2l-.45.65a1.65 1.65 0 0 0-2.2-45a1.65 1.65 0 0 0-.452.2"></path>
                <path d="M12 1.1v.001"></path>
                <path d="M12 22.9v-.001"></path>
                <path d="M4.6 15a1.65 1.65 0 0 1-.45-2.2l.45.65a1.65 1.65 0 0 1 2.2-45a1.65 1.65 0 0 1 .452.2"></path>
                <path d="M1.1 12h.001"></path>
                <path d="M22.9 12h-.001"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="demo-section">
        <h3 class="demo-section-title">设置面板</h3>
        <div class="settings-panel">
          <div class="settings-header">
            <h3>设置</h3>
          </div>
          <div class="settings-content">
            <div class="setting-item">
              <label>快捷键</label>
              <div class="shortcut-input-wrapper">
                <input type="text" id="shortcutInput" value="Command+Space" readonly placeholder="点击设置">
                <button class="clear-shortcut">清除</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="features-list">
      <h4>新功能</h4>
      <ul>
        <li><strong>快捷键自定义：</strong>点击设置按钮进入快捷键设置</li>
        <li><strong>智能快捷键捕获：</strong>点击输入框后按任意组合键自动捕获</li>
        <li><strong>配置持久化：</strong>快捷键自动保存到用户配置目录</li>
        <li><strong>恢复默认：</strong>一键恢复默认快捷键</li>
        <li><strong>搜索增强：</strong>保持原有的应用、剪贴板、快捷片段搜索功能</li>
      </ul>
    </div>
  </div>

  <script>
    // 这是演示页面的脚本，实际的功能在 Electron 应用中
    console.log('这是一个演示页面，展示 Spotlight 搜索界面和设置面板');

    const searchInput = document.getElementById('searchInput');
    const settingsBtn = document.getElementById('settingsBtn');
    
    searchInput.placeholder = '试试搜索：calc、;email、: 等关键词';

    let mockItems = [
      { title: '计算器', subtitle: '应用程序', icon: 'APP', type: 'app' },
      { title: ';email', subtitle: '我的邮箱', icon: 'SNP', type: 'snippet' },
      { title: '复制的内容...', subtitle: '刚刚', icon: 'CLIP', type: 'clipboard' }
    ];

    let searchTerm = '';
    let selectedIndex = 0;

    function renderMockResults() {
      const container = document.createElement('div');
      container.className = 'results-container visible';
      container.style.marginTop = '12px';
      container.style.display = 'block';
      
      container.innerHTML = mockItems.map((item, index) => `
        <div class="result-item ${index === 0 ? 'selected' : ''}">
          <div class="result-icon ${item.type === 'clipboard' ? 'clipboard-icon' : item.type === 'snippet' ? 'snippet-icon' : ''}">${item.icon}</div>
          <div class="result-info">
            <div class="result-title">${item.title}</div>
            <div class="result-subtitle">${item.subtitle}</div>
          </div>
        </div>
      `).join('');

      const parent = document.querySelector('.spotlight-container');
      const existing = parent.querySelector('.results-container');
      if (existing) existing.remove();
      parent.appendChild(container);
    }

    searchInput.addEventListener('input', (e) => {
      searchTerm = e.target.value;
      if (searchTerm) {
        renderMockResults();
      } else {
        const container = document.querySelector('.results-container');
        if (container) container.remove();
      }
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === 'Escape') {
        e.preventDefault();
        const container = document.querySelector('.results-container');
        if (container) container.remove();
        searchInput.value = '';
      }
    });

    settingsBtn.addEventListener('click', () => {
      alert('设置面板：在真实的 Electron 应用中，点击这里可以打开设置面板来自定义快捷键');
    });
  </script>
</body>
</html>
