<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotlight Search Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 60px;
    }

    .hint {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      backdrop-filter: blur(10px);
      max-width: 600px;
      text-align: center;
    }

    .hint kbd {
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 6px;
      border-radius: 3px;
      margin: 0 2px;
    }

    .spotlight-container {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 12px;
      box-shadow: 0 22px 70px 4px rgba(0, 0, 0, 0.28), 0 0 0 0.5px rgba(0, 0, 0, 0.08);
      padding: 12px;
      width: 700px;
    }

    .search-box {
      display: flex;
      align-items: center;
      height: 36px;
      padding: 0 12px;
    }

    .search-icon {
      width: 20px;
      height: 20px;
      color: #888;
      margin-right: 10px;
      flex-shrink: 0;
    }

    #searchInput {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 18px;
      outline: none;
      color: #333;
    }

    #searchInput::placeholder {
      color: #888;
    }

    .results-container {
      margin-top: 12px;
      max-height: 400px;
      overflow-y: auto;
      display: none;
    }

    .results-container.visible {
      display: block;
    }

    .result-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .result-item:hover,
    .result-item.selected {
      background: rgba(0, 122, 255, 0.1);
    }

    .result-icon {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background: linear-gradient(135deg, #007aff, #5856d6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .result-icon.clipboard-icon {
      background: linear-gradient(135deg, #34c759, #30d158);
    }

    .result-icon.snippet-icon {
      background: linear-gradient(135deg, #ff9500, #ff9f0a);
    }

    .result-info {
      flex: 1;
      min-width: 0;
    }

    .result-title {
      font-size: 14px;
      color: #333;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-subtitle {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .results-container::-webkit-scrollbar {
      width: 8px;
    }

    .results-container::-webkit-scrollbar-track {
      background: transparent;
    }

    .results-container::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="hint">
    💡 搜索示例：
    <kbd>计</kbd> 应用搜索 |
    <kbd>;e</kbd> 快捷输入 |
    <kbd>:</kbd> 剪贴板历史 |
    <kbd>↑↓</kbd> 选择 |
    <kbd>Enter</kbd> 确认
  </div>

  <div class="spotlight-container">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="搜索..." autocomplete="off">
    </div>
    <div class="results-container" id="resultsContainer">
    </div>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput')
    const resultsContainer = document.getElementById('resultsContainer')

    let allItems = [
      { title: '计算器', subtitle: '应用程序', icon: '🧮', type: 'app' },
      { title: '记事本', subtitle: '应用程序', icon: '📝', type: 'app' },
      { title: 'Safari 浏览器', subtitle: '应用程序', icon: '🌐', type: 'app' },
      { title: '邮件', subtitle: '应用程序', icon: '📧', type: 'app' },
      { title: '音乐', subtitle: '应用程序', icon: '🎵', type: 'app' },
      { title: '照片', subtitle: '应用程序', icon: '📸', type: 'app' },
      { title: '设置', subtitle: '系统偏好设置', icon: '⚙️', type: 'app' },
      { title: '终端', subtitle: '应用程序', icon: '💻', type: 'app' },
      { title: 'GitHub', subtitle: 'https://github.com', icon: '🔗', type: 'website' },
      { title: 'Google', subtitle: 'https://google.com', icon: '🔍', type: 'website' },
      { title: 'Stack Overflow', subtitle: 'https://stackoverflow.com', icon: '💡', type: 'website' },
      { title: '文档', subtitle: '我的文档', icon: '📄', type: 'file' },
      { title: '下载', subtitle: '下载文件夹', icon: '📥', type: 'file' },
      { title: '桌面', subtitle: '桌面文件夹', icon: '🖥️', type: 'file' },
      { title: '项目文件夹', subtitle: '工作空间', icon: '📁', type: 'file' }
    ]

    let clipboardHistory = [
      { content: '这是刚才复制的内容北京市朝阳区...', timestamp: Date.now() - 60000, type: 'text' },
      { content: 'https://github.com/user/repo', timestamp: Date.now() - 120000, type: 'url' },
      { content: '138-0000-1234', timestamp: Date.now() - 180000, type: 'text' },
      { content: '项目需求文档：完成用户管理模块开发', timestamp: Date.now() - 240000, type: 'text' }
    ]

    let snippets = [
      { 
        trigger: ';email', 
        content: 'user@example.com', 
        description: '我的邮箱',
        type: 'snippet'
      },
      { 
        trigger: ';addr', 
        content: '北京市朝阳区某某路123号', 
        description: '家庭地址',
        type: 'snippet'
      },
      { 
        trigger: ';tel', 
        content: '138-0000-0000', 
        description: '手机号码',
        type: 'snippet'
      },
      { 
        trigger: ';sig', 
        content: '祝好！\n张三\n2024年1月1日', 
        description: '邮件签名',
        type: 'snippet'
      },
      { 
        trigger: ';cmd', 
        content: 'git status && git add . && git commit -m ""', 
        description: 'Git 提交流程',
        type: 'snippet'
      },
      { 
        trigger: ';url', 
        content: 'https://www.example.com/very-long-url-path', 
        description: '常用网址',
        type: 'snippet'
      }
    ]

    let currentResults = []
    let selectedIndex = 0

    function getItemIcon(item) {
      if (item.type === 'clipboard') {
        return '📋'
      } else if (item.type === 'snippet') {
        return '⚡'
      }
      return item.icon
    }

    function getItemTitle(item) {
      if (item.type === 'clipboard') {
        const preview = item.content.substring(0, 50)
        return preview + (item.content.length > 50 ? '...' : '')
      } else if (item.type === 'snippet') {
        return item.trigger
      }
      return item.title
    }

    function getItemSubtitle(item) {
      if (item.type === 'clipboard') {
        return '剪贴板历史'
      } else if (item.type === 'snippet') {
        return item.description
      }
      return item.subtitle
    }

    function getTimeAgo(timestamp) {
      const seconds = Math.floor((Date.now() - timestamp) / 1000)
      if (seconds < 60) return '刚刚'
      const minutes = Math.floor(seconds / 60)
      if (minutes < 60) return `${minutes}分钟前`
      const hours = Math.floor(minutes / 60)
      if (hours < 24) return `${hours}小时前`
      const days = Math.floor(hours / 24)
      return `${days}天前`
    }

    function search(query) {
      if (!query.trim()) {
        currentResults = []
        renderResults()
        return
      }

      const lowerQuery = query.toLowerCase()
      let results = []

      results = results.concat(allItems.filter(item => 
        item.title.toLowerCase().includes(lowerQuery) ||
        item.subtitle.toLowerCase().includes(lowerQuery)
      ))

      if (query.startsWith(';')) {
        const snippetQuery = query.toLowerCase()
        results = results.concat(snippets.filter(snippet => 
          snippet.trigger.toLowerCase().includes(snippetQuery) ||
          snippet.description.toLowerCase().includes(snippetQuery)
        ))
      } else if (query.startsWith(':')) {
        const clipQuery = query.substring(1).toLowerCase()
        results = results.concat(clipboardHistory.filter(clip => 
          clip.content.toLowerCase().includes(clipQuery)
        ).map(clip => ({
          ...clip,
          type: 'clipboard',
          title: clip.content,
          subtitle: getTimeAgo(clip.timestamp)
        })))
      } else {
        results = results.concat(clipboardHistory.map(clip => ({
          ...clip,
          type: 'clipboard',
          title: clip.content,
          subtitle: getTimeAgo(clip.timestamp)
        })))
        results = results.concat(snippets)
      }

      currentResults = results.slice(0, 10)
      selectedIndex = 0
      renderResults()
    }

    function renderResults() {
      if (currentResults.length === 0) {
        resultsContainer.classList.remove('visible')
        return
      }

      resultsContainer.classList.add('visible')

      resultsContainer.innerHTML = currentResults.slice(0, 8).map((item, index) => `
        <div class="result-item ${index === selectedIndex ? 'selected' : ''}" data-index="${index}">
          <div class="result-icon ${item.type === 'clipboard' ? 'clipboard-icon' : item.type === 'snippet' ? 'snippet-icon' : ''}">${getItemIcon(item)}</div>
          <div class="result-info">
            <div class="result-title">${getItemTitle(item)}</div>
            <div class="result-subtitle">${getItemSubtitle(item)}</div>
          </div>
        </div>
      `).join('')

      document.querySelectorAll('.result-item').forEach(el => {
        el.addEventListener('click', () => {
          const index = parseInt(el.dataset.index)
          selectItem(currentResults[index])
        })
      })
    }

    function selectItem(item) {
      if (item.type === 'snippet') {
        alert('插入快捷输入: ' + item.content)
      } else if (item.type === 'clipboard') {
        alert('复制到剪贴板: ' + item.content.substring(0, 30) + '...')
      } else {
        alert('打开: ' + item.title)
      }
      searchInput.value = ''
      search('')
      searchInput.focus()
    }

    searchInput.addEventListener('input', (e) => {
      search(e.target.value)
    })

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        searchInput.value = ''
        search('')
      } else if (e.key === 'ArrowDown') {
        e.preventDefault()
        if (currentResults.length > 0) {
          selectedIndex = Math.min(selectedIndex + 1, currentResults.length - 1)
          renderResults()
        }
      } else if (e.key === 'ArrowUp') {
        e.preventDefault()
        if (currentResults.length > 0) {
          selectedIndex = Math.max(selectedIndex - 1, 0)
          renderResults()
        }
      } else if (e.key === 'Enter') {
        if (currentResults.length > 0) {
          selectItem(currentResults[selectedIndex])
        }
      }
    })

    searchInput.focus()
  </script>
</body>
</html>
